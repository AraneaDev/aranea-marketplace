name: Validate marketplace

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate
      - run: npm run generate
      - name: Check generated artifacts are committed
        run: git diff --exit-code -- generated .claude-plugin/marketplace.json
      - name: Publish validated marketplace artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: aranea-marketplace-artifacts
          path: |
            generated/marketplace.json
            generated/site-feed.json
