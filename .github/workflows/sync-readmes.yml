name: Synchronize marketplace READMEs

on:
  push:
    branches: [main]
    paths:
      - catalog.yml
      - generated/readme-snippets.json
      - src/readme-sync.ts
      - src/readme-snippets.ts
      - package-lock.json
  workflow_dispatch:
    inputs:
      approve:
        description: 'Create README synchronization pull requests after reviewing the dry-run summary'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate-and-dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Check out catalog
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate catalog and generated files
        run: |
          npm run validate
          npm run validate:manifest

      - name: Dry-run README synchronization
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          ./node_modules/.bin/tsx src/readme-sync.ts --mode=dry-run | tee sync-readme-report.txt
          {
            echo '## Marketplace README synchronization dry-run'
            echo
            echo '```text'
            cat sync-readme-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  write:
    needs: validate-and-dry-run
    if: github.event_name == 'workflow_dispatch' && inputs.approve == true
    environment: marketplace-readme-sync
    runs-on: ubuntu-latest
    steps:
      - name: Check out catalog
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create or update README pull requests
        env:
          GITHUB_APP_ID: ${{ secrets.README_SYNC_APP_ID }}
          GITHUB_APP_INSTALLATION_ID: ${{ secrets.README_SYNC_APP_INSTALLATION_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.README_SYNC_APP_PRIVATE_KEY }}
        run: ./node_modules/.bin/tsx src/readme-sync.ts --mode=write
