name: Synchronize marketplace READMEs

on:
  push:
    branches: [main]
    paths:
      - catalog.yml
      - generated/readme-snippets.json
      - src/readme-sync.ts
      - src/readme-snippets.ts
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out catalog
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate catalog and generated files
        run: |
          npm run validate
          npm run validate:manifest

      - name: Dry-run README synchronization
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          ./node_modules/.bin/tsx src/readme-sync.ts --mode=dry-run | tee sync-readme-report.txt
          {
            echo '## Marketplace README synchronization dry-run'
            echo
            echo '```text'
            cat sync-readme-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update README pull requests
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_APP_ID: ${{ secrets.GITHUB_APP_ID }}
          GITHUB_APP_INSTALLATION_ID: ${{ secrets.GITHUB_APP_INSTALLATION_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}
        run: ./node_modules/.bin/tsx src/readme-sync.ts --mode=write
